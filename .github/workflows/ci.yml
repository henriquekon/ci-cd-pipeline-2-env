name: "CI/CD Pipeline"
on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ghcr.io/henriquekon/ci-cd-pipeline-2-env

jobs:
  ci:
    name: Linter + Testes
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: receitas
          POSTGRES_PASSWORD: postgres_ci
          POSTGRES_DB: receitas_test
        options: >-
          --health-cmd "pg_isready -U receitas -d receitas_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
        ports:
          - 5432:5432
    env:
      DB_HOST: localhost
      DB_PORT: 5432
      DB_USER: receitas
      DB_PASSWORD: postgres_ci
      DB_NAME: receitas_test
      MAIL_HOST: sandbox.smtp.mailtrap.io
      MAIL_PORT: 587
      MAIL_FROM: test@receitas.com
      MAIL_TO: test@receitas.com
      MAILTRAP_USER: ${{ secrets.MAILTRAP_USER }}
      MAILTRAP_PASS: ${{ secrets.MAILTRAP_PASS }}
      MAILTRAP_API_TOKEN: ${{ secrets.MAILTRAP_API_TOKEN }}
      MAILTRAP_INBOX_ID: ${{ secrets.MAILTRAP_INBOX_ID }}
      MAILTRAP_ACCOUNT_ID: ${{ secrets.MAILTRAP_ACCOUNT_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: api/requirements.txt

      - name: Instalar dependências
        run: pip install flask flask-cors psycopg2-binary reportlab pytest pytest-html flake8 requests

      - name: Aplicar migrations no banco de teste
        run: |
          docker run --rm \
            --network host \
            -v ${{ github.workspace }}/migrations:/flyway/sql:ro \
            flyway/flyway:10-alpine \
            -url="jdbc:postgresql://localhost:5432/receitas_test" \
            -user=receitas \
            -password=postgres_ci \
            -placeholders.ADMIN_EMAIL=test@receitas.com \
            migrate

      - name: Análise de qualidade (Flake8)
        run: flake8 api/app.py --max-line-length=140 --extend-ignore=E127,E128,E122

      - name: Executar testes
        run: |
          python -m pytest tests/tests.py -v --tb=short \
            --html=reports/test-report.html \
            --self-contained-html \
            -o "junit_family=xunit2" \
            --junitxml=reports/test-results.xml

      - name: Publicar relatório de testes
        uses: actions/upload-artifact@v4
        if: always() # rodar mesmo se falhar
        with:
          name: test-report-${{ github.run_number }}
          path: reports/
          retention-days: 30

      - name: Resumo dos testes no workflow summary
        if: always()
        run: |
          echo "## Resultados dos Testes" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          # Lê o XML e extrai contadores
          TESTS=$(python3 - <<'EOF'
          import xml.etree.ElementTree as ET, sys
          try:
              tree = ET.parse("reports/test-results.xml")
              root = tree.getroot()
              suite = root if root.tag == "testsuite" else root.find("testsuite")
              total  = int(suite.attrib.get("tests", 0))
              errors = int(suite.attrib.get("errors", 0))
              fails  = int(suite.attrib.get("failures", 0))
              skip   = int(suite.attrib.get("skipped", 0))
              passed = total - errors - fails - skip
              time   = float(suite.attrib.get("time", 0))
              print(f"{total}|{passed}|{fails}|{errors}|{skip}|{time:.2f}")
          except Exception as e:
              print(f"0|0|0|0|0|0")
          EOF
          )

          IFS='|' read -r TOTAL PASSED FAILS ERRORS SKIP TIME <<< "$TESTS"

          if [ "$FAILS" -gt 0 ] || [ "$ERRORS" -gt 0 ]; then
            STATUS="Falhou"
          else
            STATUS="Passou"
          fi

          echo "### $STATUS" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Métrica | Valor |" >> $GITHUB_STEP_SUMMARY
          echo "|---------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Passou       | $PASSED  |" >> $GITHUB_STEP_SUMMARY
          echo "| Falhou       | $FAILS   |" >> $GITHUB_STEP_SUMMARY
          echo "| Erros        | $ERRORS  |" >> $GITHUB_STEP_SUMMARY
          echo "| Pulados      | $SKIP    |" >> $GITHUB_STEP_SUMMARY
          echo "| Total        | $TOTAL   |" >> $GITHUB_STEP_SUMMARY
          echo "| Duração      | ${TIME}s |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "> Relatório HTML completo disponível nos **Artifacts** deste run." >> $GITHUB_STEP_SUMMARY

  build-and-push:
    name: Build e push da imagem Docker
    needs: ci
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login no ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build e push API
        uses: docker/build-push-action@v5
        with:
          context: ./api
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}-api:latest
            ${{ env.IMAGE_NAME }}-api:${{ github.sha }}

      - name: Build e push Nginx
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.nginx
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}-nginx:latest
            ${{ env.IMAGE_NAME }}-nginx:${{ github.sha }}

  deploy-homolog:
    name: Deploy Homologação
    needs: build-and-push
    runs-on: self-hosted
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Corrigir permissões
        run: sudo chown -R $USER:$USER ~/receitas-app

      - name: Deploy homologação
        run: bash ~/receitas-app/scripts/deploy-homolog.sh

  deploy-prod:
    name: Deploy Produção
    runs-on: self-hosted
    if: github.event_name == 'workflow_dispatch'
    steps:
      - name: Corrigir permissões
        run: sudo chown -R $USER:$USER ~/receitas-app

      - name: Deploy produção
        run: bash ~/receitas-app/scripts/deploy-prod.sh